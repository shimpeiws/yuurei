name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.6.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Trusted publishing (OIDC) requires npm >= 11.5.1. The npm bundled with
      # Node 22 is 10.9.x, which has no OIDC exchange at all and fails the
      # publish with ENEEDAUTH. Node stays at 22 so the pre-publish tests run
      # on the same version CI tests against; only the publishing tool moves.
      - name: Install an npm that supports trusted publishing
        run: npm install -g npm@11.19.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version matches the release tag
        run: node scripts/verify-release-version.mjs

      - name: Pre-publish checks
        run: pnpm test

      # A prerelease goes to `next`, a clean version to `latest`. Never publish
      # a prerelease to `latest` (ADR-0020).
      - name: Derive the dist-tag
        id: dist_tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public --tag ${{ steps.dist_tag.outputs.tag }}
