name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }})
    # macOS and Linux are both declared supported (contract, Supported
    # platforms), so the suite that proves it runs on both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.6.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run check

      - name: Format check
        run: pnpm run format

      - name: Unused exports
        run: pnpm run knip

      - name: Tests
        run: pnpm test

      - name: Type check
        run: pnpm run build

      # Exercises the published artifact itself: pack, install the tarball into
      # a clean project, and run the installed bin. This runs here and not only
      # in the release workflow, so a packaging defect fails a PR instead of
      # surfacing for the first time while publishing a tag.
      - name: Package smoke test
        run: pnpm run smoke:package

  # The branch ruleset requires a check named `ci`. A matrix job reports as
  # `ci (ubuntu-latest)` / `ci (macos-latest)`, so this job carries the plain
  # name and passes only when every matrix leg has.
  ci-required:
    name: ci
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - run: echo "macOS and Linux jobs passed"
